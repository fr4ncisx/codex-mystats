<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Codex MyStats</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <span class="resize-edge resize-edge--north" data-resize-direction="North" aria-hidden="true"></span>
      <span class="resize-edge resize-edge--east" data-resize-direction="East" aria-hidden="true"></span>
      <span class="resize-edge resize-edge--south" data-resize-direction="South" aria-hidden="true"></span>
      <span class="resize-edge resize-edge--west" data-resize-direction="West" aria-hidden="true"></span>
      <span class="resize-edge resize-edge--north-east" data-resize-direction="NorthEast" aria-hidden="true"></span>
      <span class="resize-edge resize-edge--south-east" data-resize-direction="SouthEast" aria-hidden="true"></span>
      <span class="resize-edge resize-edge--south-west" data-resize-direction="SouthWest" aria-hidden="true"></span>
      <span class="resize-edge resize-edge--north-west" data-resize-direction="NorthWest" aria-hidden="true"></span>
      <header class="window-actions" data-tauri-drag-region>
        <div class="window-brand" data-tauri-drag-region>
          <span class="app-name">Codex MyStats</span>
          <span class="version-badge" id="app-version-badge" aria-label="Loading version" data-i18n-aria="versionLoading">v…</span>
        </div>
        <div class="drag-handle" data-tauri-drag-region aria-hidden="true"></div>
        <nav class="header-actions" aria-label="Window actions" data-i18n-aria="windowActions">
          <button
            class="icon-button topmost-toggle"
            id="always-on-top-button"
            type="button"
            aria-label="Turn off always on top"
            title="Turn off always on top"
            data-i18n-aria="alwaysOnTopOn"
            data-i18n-title="alwaysOnTopOn"
            aria-pressed="true"
          >
            <span class="lucide-icon lucide-icon--pin" aria-hidden="true"></span>
            <span class="lucide-icon lucide-icon--pin-off" aria-hidden="true" hidden></span>
          </button>
          <button
            class="icon-button"
            id="settings-button"
            type="button"
            aria-controls="settings-panel"
            aria-expanded="false"
            aria-label="Settings"
            title="Settings"
            data-i18n-aria="settingsButton"
            data-i18n-title="settingsButton"
          >
            <span class="lucide-icon lucide-icon--settings settings-icon" aria-hidden="true"></span>
            <span class="lucide-icon lucide-icon--back back-icon" aria-hidden="true" hidden></span>
          </button>
          <button class="icon-button window-minimize" id="minimize-button" type="button" aria-label="Minimize" title="Minimize" data-i18n-aria="minimize" data-i18n-title="minimize">
            <span class="lucide-icon lucide-icon--minimize" aria-hidden="true"></span>
          </button>
          <button class="icon-button window-close" id="close-button" type="button" aria-label="Close" title="Close" data-i18n-aria="close" data-i18n-title="close">
            <span class="lucide-icon lucide-icon--close" aria-hidden="true"></span>
          </button>
        </nav>
      </header>

      <main class="main-content">
        <section class="dashboard-view" id="dashboard-view" aria-label="Usage limits" data-i18n-aria="usageLimits">
          <p class="status-message" id="connection-message" role="status" aria-live="polite" hidden></p>

          <section class="quota-card" id="five-hour-card" aria-labelledby="five-hour-title">
            <div class="quota-heading">
              <h1 id="five-hour-title" data-i18n="fiveHour">5-hour</h1>
              <div class="remaining-block">
                <strong id="five-hour-percent">—</strong>
                <span data-i18n="remaining">remaining</span>
              </div>
            </div>
            <div
              class="quota-meter"
              id="five-hour-progress"
              role="progressbar"
              aria-label="Percentage remaining in the 5-hour window"
              data-i18n-aria="fiveHourProgress"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <div class="meter-track" aria-hidden="true">
                <div class="meter-fill"></div>
              </div>
              <span class="threshold-marker" aria-hidden="true">
                <i></i><i></i><i></i>
              </span>
            </div>
            <p class="quota-reset" id="five-hour-reset" data-i18n="resetUnavailable">Reset time unavailable</p>
          </section>

          <section class="quota-card" id="weekly-card" aria-labelledby="weekly-title">
            <div class="quota-heading">
              <h2 id="weekly-title" data-i18n="weekly">Weekly</h2>
              <div class="remaining-block">
                <strong id="weekly-percent">—</strong>
                <span data-i18n="remaining">remaining</span>
              </div>
            </div>
            <div
              class="quota-meter"
              id="weekly-progress"
              role="progressbar"
              aria-label="Percentage remaining in the weekly window"
              data-i18n-aria="weeklyProgress"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <div class="meter-track" aria-hidden="true">
                <div class="meter-fill"></div>
              </div>
              <span class="threshold-marker" aria-hidden="true">
                <i></i><i></i><i></i>
              </span>
            </div>
            <p class="quota-reset" id="weekly-reset" data-i18n="resetUnavailable">Reset time unavailable</p>
          </section>
        </section>

        <section class="settings-panel" id="settings-panel" aria-labelledby="settings-title" hidden>
          <div class="settings-heading">
            <h1 id="settings-title" data-i18n="settingsTitle">Settings</h1>
            <div class="settings-tabs" role="tablist" aria-label="Settings sections" data-i18n-aria="settingsTabsLabel">
              <button class="settings-tab" id="general-tab" type="button" role="tab" aria-selected="true" aria-controls="general-panel" tabindex="0" data-i18n="generalTab">General</button>
              <button class="settings-tab" id="limits-tab" type="button" role="tab" aria-selected="false" aria-controls="limits-panel" tabindex="-1" data-i18n="limitsTab">Limits</button>
            </div>
          </div>

          <div class="settings-tab-panel general-panel" id="general-panel" role="tabpanel" aria-labelledby="general-tab">
            <section class="setting-card language-setting" aria-labelledby="language-label">
              <span class="setting-label" id="language-label" data-i18n="languageLabel">Language</span>
              <div class="language-options" role="group" aria-labelledby="language-label">
                <button class="language-option" id="language-en" type="button" lang="en" aria-pressed="true">English</button>
                <button class="language-option" id="language-es" type="button" lang="es" aria-pressed="false">Español</button>
              </div>
            </section>
            <section class="remembered-close-setting" id="remembered-close-setting" aria-labelledby="close-setting-label" hidden>
              <div class="remembered-close-copy">
                <span class="setting-label" id="close-setting-label" data-i18n="closeSettingLabel">When closing the window</span>
                <span id="remembered-close-text"></span>
              </div>
              <button
                class="icon-button remembered-close-reset"
                id="reset-close-preference-button"
                type="button"
                aria-label="Ask every time"
                title="Ask every time"
                data-i18n-aria="askEveryTime"
                data-i18n-title="askEveryTime"
              >
                <span class="lucide-icon lucide-icon--refresh" aria-hidden="true"></span>
              </button>
            </section>
            <p class="save-message" data-save-message role="status" aria-live="polite" hidden></p>
          </div>

          <div class="settings-tab-panel limits-panel" id="limits-panel" role="tabpanel" aria-labelledby="limits-tab" hidden>
            <fieldset class="threshold-setting">
              <legend data-i18n="fiveHour">5-hour</legend>
              <div class="setting-row">
                <label for="threshold-5h-range" data-i18n="thresholdPrompt">Notify me when it drops to</label>
                <label class="number-field">
                  <span class="visually-hidden" data-i18n="fiveHourThresholdLabel">5-hour remaining threshold</span>
                  <input id="threshold-5h-value" type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="5-hour threshold percentage" data-i18n-aria="fiveHourThresholdLabel" />
                  <span aria-hidden="true">%</span>
                </label>
              </div>
              <input
                class="threshold-range"
                id="threshold-5h-range"
                type="range"
                min="0"
                max="100"
                step="1"
                aria-label="5-hour threshold"
                data-i18n-aria="fiveHourThresholdLabel"
              />
            </fieldset>

            <fieldset class="threshold-setting">
              <legend data-i18n="weekly">Weekly</legend>
              <div class="setting-row">
                <label for="threshold-weekly-range" data-i18n="thresholdPrompt">Notify me when it drops to</label>
                <label class="number-field">
                  <span class="visually-hidden" data-i18n="weeklyThresholdLabel">Weekly remaining threshold</span>
                  <input id="threshold-weekly-value" type="number" min="0" max="100" step="1" inputmode="numeric" aria-label="Weekly threshold percentage" data-i18n-aria="weeklyThresholdLabel" />
                  <span aria-hidden="true">%</span>
                </label>
              </div>
              <input
                class="threshold-range"
                id="threshold-weekly-range"
                type="range"
                min="0"
                max="100"
                step="1"
                aria-label="Weekly threshold"
                data-i18n-aria="weeklyThresholdLabel"
              />
            </fieldset>
            <p class="save-message" data-save-message role="status" aria-live="polite" hidden></p>
          </div>
        </section>
      </main>

      <dialog class="close-dialog" id="close-dialog" aria-labelledby="close-dialog-title">
        <form method="dialog" class="close-dialog-content">
          <h2 id="close-dialog-title" data-i18n="closeDialogTitle">What would you like to do?</h2>
          <p data-i18n="closeDialogBody">Minimize to the tray or close the application.</p>
          <label class="remember-choice" for="remember-close-choice">
            <input id="remember-close-choice" type="checkbox" />
            <span data-i18n="rememberCloseChoice">Remember my choice</span>
          </label>
          <p class="close-preference-error" id="close-preference-error" role="status" aria-live="polite" hidden></p>
          <div class="close-dialog-actions">
            <button class="dialog-button" id="cancel-close-button" value="cancel" type="button" data-i18n="cancel">Cancel</button>
            <button class="dialog-button" id="minimize-close-button" value="minimize" type="button" data-i18n="closeAndMinimize">Close and minimize</button>
            <button class="dialog-button dialog-button--danger" id="quit-close-button" value="quit" type="button" data-i18n="exitApp">Exit app</button>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
