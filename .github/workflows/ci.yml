name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Rust and frontend
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Identify Rust compiler
        id: rust-version
        shell: pwsh
        run: |
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { throw "Could not identify Rust compiler." }
          "version=$($version -replace '[^a-zA-Z0-9.-]', '-')" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/debug
            target/release
            !target/**/incremental
          key: rust-v2-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'build.rs', 'tauri.conf.json', 'src/**', 'frontend/**', 'icons/**', 'capabilities/**', 'permissions/**', 'tests/usage-color-cases.json') }}
          restore-keys: |
            rust-v2-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}-

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify version and release notes
        run: node scripts/verify-release-metadata.mjs

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run install-browsers

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/usage-colors.js

      - name: Run Playwright UI tests
        run: npm test

      - name: Cache Tauri CLI 2.12.2
        id: tauri-cli-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.tool_cache }}/tauri-cli/2.12.2
          key: tauri-cli-v1-${{ runner.os }}-${{ runner.arch }}-2.12.2

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install tauri-cli --version "=2.12.2" --locked --root "${{ runner.tool_cache }}/tauri-cli/2.12.2"

      - name: Add Tauri CLI to PATH
        shell: pwsh
        run: '"${{ runner.tool_cache }}/tauri-cli/2.12.2/bin" >> $env:GITHUB_PATH'

      - name: Verify Tauri CLI version
        shell: pwsh
        run: |
          $version = cargo tauri --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne 'tauri-cli 2.12.2') {
            throw "Expected Tauri CLI 2.12.2, got: $version"
          }

      - name: Build Windows executable
        run: cargo tauri build --no-bundle

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
