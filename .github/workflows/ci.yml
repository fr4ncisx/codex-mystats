name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Rust and frontend
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Verify version and release notes
        shell: pwsh
        run: |
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo metadata validation failed."
          }
          $metadata = $metadataJson | ConvertFrom-Json
          $cargoVersion = ($metadata.packages | Where-Object { $_.name -eq "codex-mystats" }).version
          $tauriVersion = (Get-Content -Raw tauri.conf.json | ConvertFrom-Json).version
          if ($cargoVersion -ne $tauriVersion) {
            throw "Cargo.toml version $cargoVersion does not match tauri.conf.json version $tauriVersion."
          }
          $releaseNotesPath = ".github/release-notes/v$tauriVersion.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "Curated release notes not found: $releaseNotesPath"
          }
          $releaseNotes = Get-Content -Raw -LiteralPath $releaseNotesPath -Encoding utf8
          if ($releaseNotes -notmatch "(?m)^# Codex-MyStats v$([regex]::Escape($tauriVersion))$") {
            throw "Release notes title does not match application version $tauriVersion."
          }

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install frontend test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run install-browsers

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js

      - name: Run Playwright UI tests
        run: npm test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "=2.12.2" --locked

      - name: Build Windows executable
        run: cargo tauri build --no-bundle

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
