name: Feature request
description: Suggest an improvement to WIMU.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Usage limits
        - Tray indicators
        - Window or resizing
        - Settings
        - Sound alerts
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe when the current WIMU behavior falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should WIMU do?
      description: Describe the behavior you would expect instead.
    validations:
      required: true
